#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - ufw
runcmd:
  - [ bash, -lc, "curl -fsSL https://get.docker.com | sh" ]
  - [ bash, -lc, "usermod -aG docker ubuntu" ]
  - [ bash, -lc, "systemctl enable --now docker" ]
  - [ bash, -lc, "ufw default deny incoming" ]
  - [ bash, -lc, "ufw default allow outgoing" ]
  - [ bash, -lc, "ufw allow OpenSSH" ]
  - [ bash, -lc, "ufw allow 80/tcp" ]
  - [ bash, -lc, "ufw allow 443/tcp" ]
  - [ bash, -lc, "ufw --force enable" ]
  - [ bash, -lc, "mkdir -p /opt/cryptopulse && chown ubuntu:ubuntu /opt/cryptopulse" ]
final_message: "CryptoPulse OCI bootstrap completed"
