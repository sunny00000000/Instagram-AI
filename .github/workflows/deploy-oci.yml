name: Deploy OCI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-oci
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
      - name: Pull, rebuild and health-check
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" \
            'cd /opt/cryptopulse && git fetch origin && git checkout main && git pull --ff-only origin main && docker compose build --pull && docker compose up -d --remove-orphans && sleep 10 && docker compose exec -T app curl --fail http://127.0.0.1:8080/health'
